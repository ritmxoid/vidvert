<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  
  <!-- Subtle dark squircle container so the green and red pop in both dark & light browser tabs -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  
  <!-- Green Crop Box Overlapping Lines -->
  <line x1="16" y1="28" x2="80" y2="28" stroke="#22c55e" stroke-width="7.5" stroke-linecap="square" />
  <line x1="28" y1="16" x2="28" y2="88" stroke="#22c55e" stroke-width="7.5" stroke-linecap="square" />
  <line x1="20" y1="84" x2="88" y2="84" stroke="#22c55e" stroke-width="7.5" stroke-linecap="square" />
  <line x1="78" y1="22" x2="78" y2="94" stroke="#22c55e" stroke-width="7.5" stroke-linecap="square" />

  <!-- Stylized Purple 'V' extending above top line -->
  <path d="M 28 32 L 53 84 L 75 8" stroke="#8b5cf6" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Red REC Dot -->
  <circle cx="53" cy="42" r="7.5" fill="#ef4444" />
</svg>
